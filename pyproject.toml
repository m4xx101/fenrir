[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fenrir"
version = "0.1.0"
description = "Fenrir Pro-Max: Autonomous Offensive Agent Platform"
requires-python = ">=3.10"
readme = "PLAN.md"
license = {text = "MIT"}
dependencies = [
    "openai>=1.10.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "chromadb>=0.4.22",
    "langchain-core>=0.1.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
    "jinja2>=3.1.2",
    "aiofiles>=23.2.0",
    "aiosqlite>=0.19.0",
    "xmltodict>=0.13.0",
    "tiktoken>=0.5.0",
    "tenacity>=8.2.3",
    "click>=8.1.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
fenrir = "fenrir.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[tool.setuptools.packages.find]
include = ["fenrir*"]

[tool.ruff]
target-version = "py310"
line-length = 120
